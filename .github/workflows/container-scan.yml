
name: Container Security Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t container-security-demo:${{ github.sha }} .

      - name: Generate Detailed Trivy Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: container-security-demo:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Summarize Vulnerability Counts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter

          with open("trivy-results.json") as f:
              report = json.load(f)

          counts = Counter()

          for result in report.get("Results") or []:
              for vuln in result.get("Vulnerabilities") or []:
                  counts[vuln.get("Severity", "UNKNOWN")] += 1

          print("=== TRIVY VULNERABILITY SUMMARY ===")

          for severity in ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]:
              print(f"{severity}: {counts[severity]}")

          print(f"TOTAL: {sum(counts.values())}")
          PY

      - name: Generate Trivy SARIF Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: container-security-demo:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy Results to GitHub
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Detailed Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-detailed-report
          path: trivy-results.json
          if-no-files-found: warn

      - name: Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: container-security-demo:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
